<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jannat AI 💜</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #292333;
      display: grid;
      place-items: center;
      font-size: 24px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .online { color: #198754; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 15px;
      word-wrap: break-word;
    }

    .bot {
      align-self: flex-start;
      background: #f0eef3;
      border-bottom-left-radius: 5px;
    }

    .me {
      align-self: flex-end;
      background: #292333;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bottom {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 13px 15px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #292333;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #mic.listening {
      background: #c0392b;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="avatar">💜</div>
      <div>
        <h1>Jannat</h1>
        <div class="status">
          <span class="online">● Online</span> · AI Companion
        </div>
      </div>
    </header>

    <section id="chat">
      <div class="msg bot">
        Assalamu Alaikum! 💜 I'm Jannat. I'm happy you're here!
        How are you today?
      </div>
    </section>

    <div class="bottom">
      <input id="input" type="text" placeholder="Message Jannat...">
      <button id="send" title="Send">➤</button>
      <button id="mic" title="Speak">🎤</button>
    </div>
  </main>

  <script>
    const WORKER_URL = "https://jannat-ai.tedaotudum.workers.dev/";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const micButton = document.getElementById("mic");

    // Stores messages during this browser session
    const messages = [];

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "msg " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "en-US";
      speech.rate = 0.95;
      speech.pitch = 1.1;
      window.speechSynthesis.speak(speech);
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "me");
      input.value = "";

      messages.push({
        role: "user",
        content: text
      });

      const loading = addMessage("Jannat is thinking... 💜", "bot");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();
        loading.remove();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        const reply = data.reply || "I'm here with you. 💜";

        messages.push({
          role: "assistant",
          content: reply
        });

        addMessage(reply, "bot");
        speak(reply);

      } catch (error) {
        loading.remove();
        addMessage(
  "Connection error: " + error.message,
  "bot"
);
          
          
   
        console.error(error);
      }
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    // Voice input
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = false;

      micButton.addEventListener("click", () => {
        try {
          recognition.start();
          micButton.classList.add("listening");
        } catch (error) {
          console.log(error);
        }
      });

      recognition.addEventListener("result", event => {
        input.value = event.results[0][0].transcript;
        sendMessage();
      });

      recognition.addEventListener("end", () => {
        micButton.classList.remove("listening");
      });

      recognition.addEventListener("error", () => {
        micButton.classList.remove("listening");
      });
    } else {
      micButton.style.display = "none";
    }
  </script>
</body>
</html>
