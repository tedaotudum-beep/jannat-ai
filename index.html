
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171322">
<title>Jannat AI 💜</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #100d18;
  color: #f5f1ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 700px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #191526;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid #ffffff18;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #8b5cf6;
  display: grid;
  place-items: center;
  font-size: 24px;
}

h1 {
  margin: 0;
  font-size: 20px;
}

.status {
  font-size: 12px;
  color: #86efac;
  margin-top: 4px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 85%;
  padding: 12px 15px;
  border-radius: 18px;
  line-height: 1.5;
  font-size: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #30263f;
  border-bottom-left-radius: 5px;
}

.me {
  align-self: flex-end;
  background: #7546b8;
  border-bottom-right-radius: 5px;
}

.typing {
  color: #c4b5fd;
  font-style: italic;
}

.notice {
  padding: 8px 12px;
  color: #aaa1ba;
  font-size: 11px;
  text-align: center;
}

.composer {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #ffffff18;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px 16px;
  border: 1px solid #ffffff25;
  border-radius: 25px;
  background: #100d18;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: #8b5cf6;
  color: white;
  font-size: 19px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#mic {
  background: #423255;
}

.toolbar {
  text-align: right;
  padding: 5px 12px;
}

.clear {
  width: auto;
  height: auto;
  padding: 7px 12px;
  border-radius: 10px;
  background: transparent;
  color: #c4b5fd;
  font-size: 12px;
}

</style>
</head>

<body>

<main class="app">

<header>
  <div class="avatar">💜</div>
  <div>
    <h1>Jannat</h1>
    <div class="status">● Online · AI Companion</div>
  </div>
</header>

<div class="toolbar">
  <button class="clear" id="clear">
    Clear conversation
  </button>
</div>

<section id="chat">
  <div class="msg bot">
    Hey jaan! 💜 I'm Jannat. I'm so happy you're here.
    Tell me, what's on your mind today?
  </div>
</section>

<div class="notice">
  Jannat is an AI companion. Your messages are sent to the AI service through your Cloudflare Worker.
  The AI provider's safety rules still apply.
</div>

<form class="composer" id="form">
  <input
    id="input"
    type="text"
    placeholder="Message Jannat..."
    autocomplete="off"
  >

  <button id="send" type="submit">➤</button>

  <button id="mic" type="button">🎤</button>
</form>

</main>

<script>

const WORKER_URL =
"https://jannat-ai.tedaotudum.workers.dev/";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const form = document.getElementById("form");
const sendButton = document.getElementById("send");
const micButton = document.getElementById("mic");
const clearButton = document.getElementById("clear");

const messages = [];

function addMessage(text, who) {

  const element = document.createElement("div");

  element.className = "msg " + who;
  element.textContent = text;

  chat.appendChild(element);

  chat.scrollTop = chat.scrollHeight;

  return element;
}

function speak(text) {

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";
  speech.rate = 0.96;
  speech.pitch = 1.08;

  window.speechSynthesis.speak(speech);
}

function setBusy(busy) {

  sendButton.disabled = busy;
  input.disabled = busy;

  sendButton.textContent = busy ? "..." : "➤";
}

async function sendMessage(text) {

  const message = (text || input.value).trim();

  if (!message || sendButton.disabled) return;

  addMessage(message, "me");

  input.value = "";

  messages.push({
    role: "user",
    content: message
  });

  const loading = addMessage(
    "Jannat is thinking... 💜",
    "bot"
  );

  loading.classList.add("typing");

  setBusy(true);

  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        messages: messages
      })

    });

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        "Server returned an invalid response. HTTP " +
        response.status
      );
    }

    if (!response.ok) {

      throw new Error(
        data.error || "Server error: HTTP " + response.status
      );

    }

    if (!data.reply) {
      throw new Error("No reply received from Jannat.");
    }

    messages.push({
      role: "assistant",
      content: data.reply
    });

    loading.remove();

    addMessage(data.reply, "bot");

    speak(data.reply);

  } catch (error) {

    loading.remove();

    addMessage(
      "Connection problem: " + error.message,
      "bot"
    );

    console.error("Jannat error:", error);

  } finally {

    setBusy(false);

    input.focus();

  }
}

form.addEventListener("submit", function(event) {

  event.preventDefault();

  sendMessage();

});

clearButton.addEventListener("click", function() {

  messages.length = 0;

  chat.replaceChildren();

  addMessage(
    "Welcome back, jaan! 💜 What would you like to talk about?",
    "bot"
  );

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

});


// Voice input

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (Recognition) {

  const recognition = new Recognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  micButton.addEventListener("click", function() {

    try {
      recognition.start();
      micButton.textContent = "⏺";
    } catch (error) {
      console.log(error);
    }

  });

  recognition.addEventListener("result", function(event) {

    input.value = event.results[0][0].transcript;

    sendMessage();

  });

  recognition.addEventListener("end", function() {

    micButton.textContent = "🎤";

  });

  recognition.addEventListener("error", function() {

    micButton.textContent = "🎤";

  });

} else {

  micButton.style.display = "none";

}

</script>

</body>
</html>
